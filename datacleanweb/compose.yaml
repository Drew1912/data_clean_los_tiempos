name: datacleanweb
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/fase_1/schema_propuesto.sql:/docker-entrypoint-initdb.d/001_inicial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      PGUSER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - temporales:/app/temporales
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
volumes:
  postgres_data:
  temporales:
